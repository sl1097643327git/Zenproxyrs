services:
  zen-proxy:
    build: .
    ports:
      - "${PORT:-4000}:4000"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - zen-proxy-data:/tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional Redis for global budget / session affinity
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped

volumes:
  zen-proxy-data:
